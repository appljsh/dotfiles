include mocha3.conf

# Appearence
background_opacity 1
#background_tint 0.6
#background_image /home/denko/Pictures/Wallpapers/beach.jpg
background_image_layout centered
background_blur 4
cursor_shape block
window_padding_width 20 
# url_color #e8eaed
url_style curly

# Cursor
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_blink_interval 0

# Options
disable_ligatures never
enable_audio_bell no
confirm_os_window_close 0

# Font
font_family GohuFontuni14NerdFontMono
font_size 14
bold_font        auto
italic_font      auto
bold_italic_font auto

# Shell
shell /usr/bin/zsh
