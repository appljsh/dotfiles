$mainMod = MOD1 # Sets "Alt" key as main modifier

# Assign apps
$terminal = kitty
$fileManager = nemo
$menu = rofi --show drun

# Main Binds
bind = $mainMod, return, exec, $terminal
bind = MOD1_SHIFT, return, exec, kitty --title kittyfloat
bind = $mainMod, Q, killactive,
bind = $mainMod,Tab,cyclenext
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, O, exec, ~/.config/rofi/menu.sh & play '~/Music/Sounds/tut.mp3' &
bind = $mainMod, mouse:274, togglefloating,
bind = $mainMod, SPACE, exec, rofi -show drun -config ~/.config/rofi/drun.rasi theme ~/.config/rofi/drun.rasi 
bind = $mainMod, P, exec, ~/.config/rofi/powermenu.sh & play '~/Music/Sounds/confirm.mp3' &
bind = $mainMod SHIFT, BackSpace, exec, hyprctl clients | awk '/title: ./ { gsub("\t*title: *", ""); print}' | rofi -dmenu -i -p "Kill:" -theme ~/.config/rofi/kill/kill.rasi | xargs -I{} hyprctl dispatch closewindow "title:{}" & play '~/Music/Sounds/tut.mp3' &
bind = MOD1_SHIFT, P, pseudo, # dwindle
bind = $mainMod, Y, layoutmsg, togglesplit # dwindle
bind = $mainMod, Z, exec, zen-browser
bind = $mainMod, N, exec, xpad
bind = $mainMod, W, exec, ~/.config/scripts/waypaper.sh
bind = MOD1_SHIFT, D, exec, ~/.config/scripts/mute.sh
bind = $mainMod, I, exec, ~/.config/scripts/screensaver.sh
bind = MOD1_SHIFT, I, exec, ~/.config/scripts/screensaver-end.sh
bind = $mainMod, mouse:276, exec, swaync-client --toggle-panel & play '~/Music/Sounds/swnc.mp3' &
bind = , PRINT, exec, flameshot gui -c & sleep 5 & play '~/Music/Sounds/shot.mp3' &
bind = $mainMod, PRINT, exec, flameshot gui --path ~/Pictures/Screenshots/ & sleep 5 & play '~/Music/Sounds/shot.mp3' &
bind = MOD1, F, fullscreen

# Refresh waybar
bind = MOD1_SHIFT, R, exec, ~/.config/scripts/refresh-waybar.sh
bind = MOD1_SHIFT, Z, exec, ~/.config/scripts/reload-zen.sh
hide_special_on_workspace_change = on

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move windows
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# rezise windows
bindel = $mainMod SHIFT, right, resizeactive, 60 0
bindel = $mainMod SHIFT, left, resizeactive, -60 0
bindel = $mainMod SHIFT, up, resizeactive, 0 -60
bindel = $mainMod SHIFT, down, resizeactive, 0 60 

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspace
bind = $mainMod, S, togglespecialworkspace, spotify
workspace = special:spotify, border:true, gapsout:80, gapsin:50

bind = $mainMod, C, togglespecialworkspace, whatsapp
bind = $mainMod SHIFT, C, movetoworkspace, special:whatsapp
workspace = special:whatsapp, border:true, gapsout:80, gapsin:50, dimaround

bind = $mainMod, A, togglespecialworkspace, blackboard
bind = $mainMod SHIFT, A, movetoworkspace, special:blackboard
workspace = special:blackboard, border:true, gapsout:50, gapsin:50,

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 1%+ && wp-vol
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%- && wp-vol
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

