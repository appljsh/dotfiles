  match:class = (flameshot)
  match:title = (flameshot)
}


# Blur
layerrule {
  name = swaynccenter
  blur = on
  animation = slide right 20%
  ignore_alpha = 0
  match:namespace = swaync-control-center
}

layerrule {
  name = swayncnotification
  blur = on
  ignore_alpha = 0
  match:namespace = swaync-notification-window
}

layerrule {
  name = waybar
  blur = on
  ignore_alpha = 0
  match:namespace = waybar
}

layerrule {
  name = rofi
  blur = on
  animation = slide 85%
  ignore_alpha = 0
  match:namespace = rofi
}


