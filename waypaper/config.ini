[Settings]
language = en
folder = ~/Pictures/Wallpapers
monitors = All
wallpaper = ~/Pictures/Wallpapers/e9a9a53444_chill-cat-coffee.png
show_path_in_tooltip = True
backend = awww
fill = fill
sort = daterev
color = #ffffff
subfolders = False
all_subfolders = False
show_hidden = False
show_gifs_only = False
zen_mode = False
post_command = matugen --show-colors -t scheme-fidelity image $wallpaper & ~/.config/scripts/refresh-waybar.sh
swww_transition_type = right
swww_transition_step = 63
swww_transition_angle = 135
swww_transition_duration = 4
swww_transition_fps = 100
mpvpaper_sound = False
mpvpaper_options = profile=fast --vf-add=fps=60:round=near
use_xdg_state = False
stylesheet = /home/denko/.config/waypaper/style.css
number_of_columns = 3
keybindings = ~/.config/waypaper/keybindings.ini
wallpaperengine_folder = ~/.steam/root/steamapps/workshop/content/431960
linux_wallpaperengine_clamp = none
linux_wallpaperengine_volume = 0
linux_wallpaperengine_silent = True
linux_wallpaperengine_noautomute = True
linux_wallpaperengine_no_audio_processing = True
linux_wallpaperengine_fps = 100
linux_wallpaperengine_disable_particles = True
linux_wallpaperengine_disable_mouse = True
linux_wallpaperengine_disable_parallax = True
linux_wallpaperengine_no_fullscreen_pause = False

