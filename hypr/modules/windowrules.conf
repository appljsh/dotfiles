windowrule {
  name = general
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}

windowrule {
  name = maximize_disable
  suppress_event = maximize
  match:class = .*
}

windowrule { 
  name = minecraft
  float = no
  center = on
  match:class = ^(minecraft-launcher)$
  match:title = ^(minecraft-launcher)$
}

# Opacity values
$inFocusOpacity = 1
$ooFocusOpacit = .9

windowrule {
  name = menus
  float = on
  center = on
  match:title = ^(Open File|Open|Save|Save As|Export|Import|Choose File|Rename)
  match:class = ^(.*)$
}

windowrule {
