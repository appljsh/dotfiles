
$interval=3
$curve=easeOut

animations { 
  enabled = yes

  bezier = default, 0, 1, 0, 1
  bezier = wind, 0.05, 0.69, 0.1, 1
  bezier = winIn, 0.1, 1.1, 0.1, 1
  bezier = winOut, 0.3, 1, 0, 1
  bezier = linear, 1, 1, 1, 1

  bezier = easeOut, 0.16, 1, 0.3, 1
  bezier = dnko, 0.175, 0.885, 0.32, 1.275
  bezier = dnkocl, 0.6, -0.28, 0.735, 0.045
  bezier = wrk, 0.165, 0.84, 0.44, 1
  bezier = cubic, 0.19, 1, 0.22, 1 
  bezier = windows, 0.16, 1, 0.3, 1
  bezier = spe, 0.34, 1.56, 0.64, 1
  bezier = quart, 0.25, 1, 0.5, 1
  
  animation = layersIn, 1, 4, cubic, fade
  animation = layersOut, 1, 4, cubic, fade 

  animation = windowsIn, 1, 4, quart, popin 10%
  animation = windowsOut, 1, 10, quart, popin 10%
  animation = windowsMove, 1, 3, quart, slide

  animation = fadeIn, 1, 8, cubic
  animation = fadeOut, 1, 4, cubic
  animation = fadeDim, 1, $interval, cubic
  animation = fadeLayers, 1, $interval, cubic
  animation = fadeLayersIn, 1, $interval, cubic
  animation = fadeLayersOut, 1, $interval, cubic
  animation = fadePopups, 1, $interval, cubic
  animation = fadePopupsIn, 1, $interval, cubic
  animation = fadePopupsOut, 1, $interval, cubic

  animation = border, 1, 15, cubic


  animation  = workspacesIn, 1, 5, windows, slidefade 20%
  animation  = workspacesOut, 1, 5, windows, slidefade 20%
  animation  = specialWorkspaceIn, 1, 4, windows, slidefadevert 20%
  animation  = specialWorkspaceOut, 1, 4, windows, slidefadevert 80%

}
